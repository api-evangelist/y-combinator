aid: y-combinator
name: Y Combinator
description: >-
  Y Combinator is the most influential startup accelerator in the world, founded
  in 2005 by Paul Graham, Jessica Livingston, Robert Tappan Morris, and Trevor
  Blackwell. Originally split between Cambridge, Massachusetts and Mountain View,
  California, YC consolidated in Silicon Valley and is now headquartered in San
  Francisco. YC runs a three-month program four times a year (winter, spring,
  summer, fall), each batch typically funding 250-300 early-stage startups. Its
  standard deal invests $500,000 in every company: $125,000 for 7% of the company
  on a post-money SAFE, plus $375,000 on an uncapped SAFE with a Most Favored
  Nation (MFN) provision. YC has funded more than 5,000 companies with a combined
  valuation exceeding $600 billion, including Airbnb, Stripe, Coinbase, DoorDash,
  Instacart, Dropbox, Reddit, Twitch, GitLab, and Ginkgo Bioworks. The firm is
  led by president and CEO Garry Tan, a General Partner and himself a YC alum. YC
  is sector-agnostic but heavily developer-tools, AI, fintech, B2B/SaaS,
  infrastructure, healthcare, and hard-tech oriented, and its alumni network of
  6,000+ founders, plus Demo Day, Startup School, Work at a Startup, and Hacker
  News, form the connective tissue of the modern startup ecosystem.
